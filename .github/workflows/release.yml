name: release

on:
  push:
    tags:
      - 'v*'

# No default token scopes at the workflow level; each job asks for what it needs.
permissions: {}

jobs:
  # The CI workflow itself, from the tagged commit, before anything is
  # published: the same gates on both platforms, so a tag pushed on a commit
  # whose CI fails cannot become a release. Its jobs set their own timeouts.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # gh release create
      id-token: write      # Sigstore identity for the provenance attestation
      attestations: write  # store the attestation on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exact toolchain so a user can rebuild the tag and get the same bytes.
          go-version: '1.26.10'
          # Nothing restored from a cache in the job that holds write tokens.
          cache: false
      - name: check the tag
        # The tag reaches make's -ldflags, so take only a version number.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "tag $TAG is not a version such as v1.2.3"; exit 1
          fi
          # The plugin pins its users to its version, so it has to be the release's.
          got="$(python3 -c 'import json; print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')"
          if [ "$got" != "${TAG#v}" ]; then
            echo "plugin/.claude-plugin/plugin.json has version $got; the tag is $TAG"; exit 1
          fi
      - name: cross-build all platforms
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # android/amd64 is the one cgo target; point it at the runner's NDK clang.
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          export NDK_CC_AMD64="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          if [ ! -x "$NDK_CC_AMD64" ]; then
            echo "NDK clang not found at $NDK_CC_AMD64"; ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep x86_64-linux-android || true
            exit 1
          fi
          # Every file in the zips is dated at the commit time, as make release
          # does in any git checkout; a missing history fails here rather than
          # dating them 1980.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make release VERSION="$TAG"
          (cd dist && sha256sum *.zip > SHA256SUMS)
          # Record the exact toolchain so the release notes can say how to reproduce the build.
          go version | sed 's/^go version //' > dist/BUILD-TOOLCHAIN.txt
          basename "$NDK" > dist/BUILD-NDK.txt
      - name: attest build provenance
        # Every asset gets a signed SLSA provenance statement stored on the repo;
        # users verify with: gh attestation verify <file> -R ternimal/tern.
        # It always runs, so nothing is published without provenance: where the
        # repository cannot store attestations this step fails and no release
        # is created.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS
      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          toolchain="$(cat dist/BUILD-TOOLCHAIN.txt)"
          ndk="$(cat dist/BUILD-NDK.txt)"
          build="The binaries were built with $toolchain, CGO_ENABLED=0, -trimpath and -ldflags \"-s -w -buildid= -X main.version=$TAG\" from the tagged commit. With that toolchain, \`make release VERSION=$TAG\` in a clean clone of the tag rebuilds every zip to the same bytes (android/amd64 is the one cgo build and also needs the NDK clang, from NDK $ndk). Go records the state of the checkout in each binary, so an untracked or changed file in the clone changes the bytes."
          verify="Verify: every asset carries a build provenance attestation (\`gh attestation verify <file> -R ternimal/tern\`). $build"
          notes="Ternimal $TAG: a minimal, portable, secure remote terminal.

          Four small, self-contained Go binaries: \`tern\` client, \`ternd\` agent, \`ternr\` relay and \`rtern\` combined relay + client.

          Highlights:
          - reach an agent directly or through a relay for NAT traversal; the relay forwards only opaque bytes and TLS runs end-to-end with certificate pinning
          - mandatory auth by OpenSSH key or token; one connection carries shell, exec, -L/-R port forwards and file copy
          - session resume and multi-client share with one writer plus read-only viewers; client auto-reconnect; asciicast session recording
          - REST gateway: simple, streaming and async-job exec with stdin
          - MCP server, \`tern mcp\`: AI clients such as Claude Code work on your agents under a read-only default or per-host policy profiles, with approval prompts, redaction, an audit log, background jobs and interactive terminals you can watch live
          - zero-config: run \`ternd\` and paste the connect command it prints
          - Linux, macOS, Windows and Android on amd64 and arm64; every target builds without cgo except android/amd64

          Download the zip for your OS and arch below; macOS zips are named darwin. Each holds the four binaries with LICENSE, NOTICE and THIRD_PARTY_NOTICES.txt, the licenses of the code they contain. Windows builds need Windows 10 or later, and hosting a shell with ternd needs Windows 10 1809 or Windows Server 2019 or later for ConPTY.

          $verify"
          # A tag such as v1.2.0-rc.1 is a pre-release, never the latest release.
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
            "${pre[@]}" \
            --verify-tag \
            --title "Ternimal $TAG" \
            --notes "$notes"
